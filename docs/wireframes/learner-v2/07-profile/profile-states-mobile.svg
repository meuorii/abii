<svg xmlns="http://www.w3.org/2000/svg" width="390" height="535" viewBox="0 0 390 535" font-family="DejaVu Sans, Arial, sans-serif"><title>Profile states</title><desc>Conceptual Abii V2 state reference; sample content only.</desc><rect x="0.00" y="0.00" width="390.00" height="535.00" rx="0" fill="#FFF9FC" /><text x="16.00" y="35.00" font-size="21" fill="#30262B" font-weight="600" text-anchor="start">Profile states</text><text x="16.00" y="56.00" font-size="11" fill="#6F5964" font-weight="400" text-anchor="start">State reference · keep the parent grid geometry</text><rect x="16.00" y="75.00" width="358.00" height="210.00" rx="16" fill="#FFFFFF" stroke="#E8DDE1" /><rect x="158.00" y="89.00" width="74.00" height="61.00" rx="10" fill="#FFE8EF" stroke="#E8DDE1" stroke-dasharray="5 4"/><text x="195.00" y="116.50" font-size="11" fill="#6F5964" font-weight="400" text-anchor="middle">Abii</text><text x="195.00" y="132.50" font-size="8" fill="#6F5964" font-weight="400" text-anchor="middle">PLACEHOLDER</text><text x="195.00" y="171.00" font-size="15" fill="#30262B" font-weight="600" text-anchor="middle">No profile picture</text><text x="36.00" y="194.00" font-size="12" fill="#6F5964" font-weight="400" text-anchor="start">Use accent-colored initials only when no photo is</text><text x="36.00" y="210.00" font-size="12" fill="#6F5964" font-weight="400" text-anchor="start">saved.</text><rect x="36.00" y="233.00" width="318.00" height="40.00" rx="10" fill="#F8769C" /><text x="195.00" y="258.00" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">Upload Photo</text><rect x="16.00" y="297.00" width="358.00" height="210.00" rx="16" fill="#FFFFFF" stroke="#E8DDE1" /><rect x="158.00" y="311.00" width="74.00" height="61.00" rx="10" fill="#FFE8EF" stroke="#E8DDE1" stroke-dasharray="5 4"/><text x="195.00" y="338.50" font-size="11" fill="#6F5964" font-weight="400" text-anchor="middle">Abii</text><text x="195.00" y="354.50" font-size="8" fill="#6F5964" font-weight="400" text