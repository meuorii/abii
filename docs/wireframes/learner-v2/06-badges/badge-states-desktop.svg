eight="400" text-anchor="middle">PLACEHOLDER</text><text x="742.00" y="171.00" font-size="18" fill="#30262B" font-weight="600" text-anchor="middle">No matching badges</text><text x="528.00" y="194.00" font-size="12" fill="#6F5964" font-weight="400" text-anchor="start">Try another rarity, category or status.</text><rect x="528.00" y="257.00" width="428.00" height="40.00" rx="10" fill="#F8769C" /><text x="742.00" y="282.00" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Reset Filters</text><rect x="24.00" y="325.00" width="468.00" height="234.00" rx="16" fill="#FFFFFF" stroke="#E8DDE1" /><rect x="221.00" y="339.00" width="74.00" height="61.00" rx="10" fill="#FFE8EF" stroke="#E8DDE1" stroke-dasharray="5 4"/><text x="258.00" y="366.50" font-size="11" fill="#6F5964" font-weight="400" text-anchor="middle">Abii</text><text x="258.00" y="382.50" font-size="8" fill="#6F5964" font-weight="400" text-anchor="middle">PLACEHOLDER</text><text x="258.00" y="421.00" font-size="18" fill="#30262B" font-weight="600" text-anchor="middle">Could not load achievements</text><text x="44.00" y="444.00" font-size="12" fill="#6F5964" font-weight="400" text-anchor="start">Do not infer earned states.</text><rect x="44.00" y="507.00" width="428.00" height="40.00" rx="10" fill="#F8769C" /><text x="258.00" y="532.00" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Try Again</text></svg>