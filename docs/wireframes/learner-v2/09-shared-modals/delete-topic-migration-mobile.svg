<svg xmlns="http://www.w3.org/2000/svg" width="390" height="508" viewBox="0 0 390 508" font-family="DejaVu Sans, Arial, sans-serif"><title>Delete This Topic?</title><desc>Conceptual shared modal V2. Existing business logic retained.</desc><rect x="0.00" y="0.00" width="390.00" height="508.00" rx="14" fill="#E3D6DC"/><rect x="16.00" y="24.00" width="358.00" height="460.00" rx="20" fill="#FFF9FC" stroke="#E8DDE1"/><rect x="17.00" y="25.00" width="356.00" height="109.00" rx="19" fill="#FFE8EF"/><rect x="284.00" y="37.00" width="68.00" height="84.00" rx="10" fill="#FFE8EF" stroke="#E8DDE1" stroke-dasharray="5 4"/><text x="318.00" y="76.00" font-size="11" fill="#6F5964" font-weight="400" text-anchor="middle">Abii</text><text x="318.00" y="92.00" font-size="8" fill="#6F5964" font-weight="400" text-anchor="middle">PLACEHOLDER</text><text x="32.00" y="60.00" font-size="20" fill="#30262B" font-weight="600" text-anchor="start">Delete This Topic?</text><text x="32.00" y="90.00" font-size="11" fill="#6F5964" font-weight="600" text-anchor="start">Choose where flashcards should go.</text><text x="361.00" y="42.00" font-size="18" fill="#6F5964" font-weight="400" text-anchor="end">×</text><rect x="32.00" y="150.00" width="326.00" height="65.00" rx="16" fill="#FFFFFF" stroke="#E8DDE1"/><text x="46.00" y="171.00" font-size="10" fill="#6F5964" font-weight="400" text-anchor="start">TOPIC</text><text x="46.00" y="194.00" font-size="15" fill="#30262B" font-weight="600" text-anchor="start">Introduction to Algebra</text><text x="32.00" y="243.00" font-size="13" fill="#30262B" font-weight="600" text-anchor="start">Destination topic (required)</text><rect x="32.00" y="254.00" width="326.00" height="44.00" rx="9" fill="#FFFFFF" stroke="#E8DDE1"/><text x="44.00" y="280.00" font-size="13" fill="#6F5964" font-weight="400" text-anchor="start">Select another topic</text><rect x="32.00" y="312.00" width="326.00" height="84.00" rx="10" fill="#FBF3E7" stroke="#E8DDE1"/><text x="44.00" y="335.00" font